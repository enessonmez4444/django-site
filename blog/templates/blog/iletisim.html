{% extends 'blog/base.html' %}

{% block title %}İletişim{% endblock %}

{% block content %}

<h2 style="text-align:center; margin:40px 0;">İletişim Formu</h2>

<div style="max-width:600px; margin:0 auto;">

    <!-- Mesaj bildirimi -->
    {% if messages %}
        {% for message in messages %}
            <div id="mesajKutusu"
                 style="margin-bottom:15px;padding:12px;border-radius:6px;
                 background:#2ecc71;color:white;text-align:center;
                 font-weight:500;">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" style="display:flex; flex-direction:column; gap:15px;">
        {% csrf_token %}

        <input type="text" name="isim" placeholder="İsminiz" required
        style="padding:10px;border-radius:5px;border:1px solid #ccc;">

        <input type="email" name="email" placeholder="Email adresiniz" required
        style="padding:10px;border-radius:5px;border:1px solid #ccc;">

        <input type="text" name="konu" placeholder="Konu" required
        style="padding:10px;border-radius:5px;border:1px solid #ccc;">

        <textarea name="mesaj" placeholder="Mesajınız" required
        style="padding:10px;border-radius:5px;border:1px solid #ccc;min-height:120px;"></textarea>

        <button type="submit"
        style="padding:12px;border:none;border-radius:6px;background:#2ecc71;color:white;font-weight:600;cursor:pointer;">
            Mesaj Gönder
        </button>

    </form>

</div>

<!-- 4 saniye sonra mesaj kaybolur -->
<script>
setTimeout(function(){
    let mesaj = document.getElementById("mesajKutusu");
    if(mesaj){
        mesaj.style.display = "none";
    }
},4000);
</script>

{% endblock %}
